apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: capstone-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: product-service:dev
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: SERVICE_NAME
              value: product
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.observability.svc.cluster.local:4318/v1/traces
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: capstone-apps
spec:
  selector:
    app: product-service
  labels:
    component: capstone-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
