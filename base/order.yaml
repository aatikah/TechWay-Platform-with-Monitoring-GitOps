apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: capstone-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:dev
          ports:
            - containerPort: 8003
          env:
            - name: PORT
              value: "8003"
            - name: SERVICE_NAME
              value: order
            - name: USER_SERVICE_URL
              value: http://user-service:8001
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8002
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.observability.svc.cluster.local:4318/v1/traces
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: capstone-apps
spec:
  selector:
    app: order-service
  labels:
    component: capstone-service
  ports:
    - name: http
      port: 8003
      targetPort: 8003
