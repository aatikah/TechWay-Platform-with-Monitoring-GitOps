apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: capstone-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: gateway-service:dev
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: SERVICE_NAME
              value: gateway
            - name: USER_SERVICE_URL
              value: http://user-service:8001
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8002
            - name: ORDER_SERVICE_URL
              value: http://order-service:8003
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:8004
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.observability.svc.cluster.local:4318/v1/traces
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: capstone-apps
spec:
  selector:
    app: gateway-service
  labels:
    component: capstone-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
