apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: capstone-services
  labels:
    release: capstone
spec:
  selector:
    matchLabels:
      component: capstone-service
  namespaceSelector:
    matchNames:
      - capstone-production
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
