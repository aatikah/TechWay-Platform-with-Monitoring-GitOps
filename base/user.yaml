apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: capstone-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:dev
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: SERVICE_NAME
              value: user
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.observability.svc.cluster.local:4318/v1/traces
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: capstone-apps
spec:
  selector:
    app: user-service
  labels:
    component: capstone-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
